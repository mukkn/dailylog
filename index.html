<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>今日のアウトプット</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&display=swap');

- { margin: 0; padding: 0; box-sizing: border-box; }

:root {
–bg: #0f0f0f;
–surface: #1a1a1a;
–border: #2a2a2a;
–text: #e8e4dc;
–text-muted: #555;
–red: #e05a5a;
–green: #5ab87a;
–yellow: #d4a64a;
–btn-bg: #2a2a2a;
–done-bg: #5ab87a;
–done-hover: #4aa06a;
}

html, body {
height: 100%;
background: var(–bg);
color: var(–text);
font-family: ‘Noto Sans JP’, sans-serif;
overscroll-behavior: none;
}

header {
position: fixed;
top: 0;
left: 0;
right: 0;
z-index: 50;
background: var(–surface);
border-bottom: 1px solid var(–border);
padding: 12px 16px;
display: flex;
align-items: center;
justify-content: space-between;
gap: 12px;
}

.date-label {
font-size: 11px;
color: var(–text-muted);
letter-spacing: 0.05em;
white-space: nowrap;
}

.counter {
font-size: 28px;
font-weight: 300;
letter-spacing: -0.02em;
transition: color 0.3s ease;
white-space: nowrap;
min-width: 80px;
text-align: center;
}
.counter.red    { color: var(–red); }
.counter.green  { color: var(–green); }
.counter.yellow { color: var(–yellow); }

.counter-unit {
font-size: 12px;
color: var(–text-muted);
margin-left: 2px;
}

.done-btn {
background: var(–done-bg);
color: #fff;
border: none;
border-radius: 10px;
padding: 10px 20px;
font-size: 15px;
font-family: ‘Noto Sans JP’, sans-serif;
font-weight: 500;
cursor: pointer;
transition: background 0.2s, transform 0.1s;
white-space: nowrap;
flex-shrink: 0;
}
.done-btn:active { transform: scale(0.96); background: var(–done-hover); }

.textarea-wrap {
position: fixed;
top: var(–header-h, 60px);
bottom: 0;
left: 0;
right: 0;
overflow-y: auto;
-webkit-overflow-scrolling: touch;
}

textarea {
width: 100%;
min-height: 100%;
background: transparent;
border: none;
outline: none;
resize: none;
color: var(–text);
font-family: ‘Noto Sans JP’, sans-serif;
font-size: 16px;
line-height: 1.9;
padding: 20px 20px 80px;
caret-color: var(–green);
letter-spacing: 0.02em;
-webkit-tap-highlight-color: transparent;
}

textarea::placeholder {
color: var(–text-muted);
font-weight: 300;
}

.modal-overlay {
display: none;
position: fixed;
inset: 0;
background: rgba(0,0,0,0.75);
z-index: 100;
align-items: flex-end;
justify-content: center;
padding: 0 0 40px;
backdrop-filter: blur(4px);
}
.modal-overlay.active { display: flex; }

.modal {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 20px;
padding: 28px 24px 24px;
width: calc(100% - 40px);
max-width: 400px;
animation: slideUp 0.25s ease;
}

@keyframes slideUp {
from { transform: translateY(30px); opacity: 0; }
to   { transform: translateY(0); opacity: 1; }
}

.modal-title {
font-size: 17px;
font-weight: 500;
margin-bottom: 6px;
color: var(–text);
}

.modal-desc {
font-size: 13px;
color: var(–text-muted);
margin-bottom: 24px;
line-height: 1.6;
}

.modal-date-preview {
font-size: 13px;
color: var(–green);
margin-top: 4px;
font-weight: 500;
}

.modal-actions {
display: flex;
gap: 10px;
}

.btn {
flex: 1;
padding: 14px;
border: none;
border-radius: 12px;
font-size: 15px;
font-family: ‘Noto Sans JP’, sans-serif;
font-weight: 500;
cursor: pointer;
transition: opacity 0.2s, transform 0.1s;
}
.btn:active { transform: scale(0.97); }
.btn-cancel { background: var(–btn-bg); color: var(–text-muted); }
.btn-yes    { background: var(–done-bg); color: #fff; }

.toast {
display: none;
position: fixed;
bottom: 50px;
left: 50%;
transform: translateX(-50%) translateY(10px);
background: var(–surface);
border: 1px solid var(–border);
color: var(–text);
font-size: 13px;
padding: 10px 20px;
border-radius: 20px;
white-space: nowrap;
z-index: 200;
transition: opacity 0.3s, transform 0.3s;
opacity: 0;
}
.toast.show {
display: block;
opacity: 1;
transform: translateX(-50%) translateY(0);
}
</style>

</head>
<body>

  <header id="header">
    <div>
      <div class="date-label" id="dateLabel">読み込み中...</div>
    </div>
    <div class="counter red" id="counter">0<span class="counter-unit">字</span></div>
    <button class="done-btn" onclick="openModal()">完了</button>
  </header>

  <div class="textarea-wrap" id="textareaWrap">
    <textarea id="editor" placeholder="今日のアウトプットをここに書いてください…"></textarea>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-title">完了しますか？</div>
      <div class="modal-desc">
        クリップボードにコピーして、テキストを消去します。
        <div class="modal-date-preview" id="datePreview"></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeModal()">キャンセル</button>
        <button class="btn btn-yes" onclick="confirmDone()">はい</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">📋 コピーしました</div>

<script>
  const editor      = document.getElementById('editor');
  const counter     = document.getElementById('counter');
  const dateLabel   = document.getElementById('dateLabel');
  const datePreview = document.getElementById('datePreview');
  const toast       = document.getElementById('toast');
  const modal       = document.getElementById('modalOverlay');
  const headerEl    = document.getElementById('header');

  const DAYS = ['日','月','火','水','木','金','土'];

  function setHeaderHeight() {
    const h = headerEl.offsetHeight;
    document.documentElement.style.setProperty('--header-h', h + 'px');
  }

  function getOutputDate() {
    const now = new Date();
    if (now.getHours() < 6) now.setDate(now.getDate() - 1);
    const y   = now.getFullYear();
    const m   = String(now.getMonth() + 1).padStart(2, '0');
    const d   = String(now.getDate()).padStart(2, '0');
    const day = DAYS[now.getDay()];
    return `◼︎${y}.${m}.${d}(${day})`;
  }

  function updateDateLabel() {
    dateLabel.textContent = getOutputDate().replace('◼︎', '');
  }

  function updateCounter() {
    const len = editor.value.length;
    counter.innerHTML = `${len}<span class="counter-unit">字</span>`;
    counter.classList.remove('red', 'green', 'yellow');
    if (len < 300)       counter.classList.add('red');
    else if (len <= 800) counter.classList.add('green');
    else                 counter.classList.add('yellow');
  }

  function openModal() {
    datePreview.textContent = getOutputDate();
    modal.classList.add('active');
  }

  function closeModal() {
    modal.classList.remove('active');
  }

  async function confirmDone() {
    closeModal();
    const text = `${getOutputDate()}\n${editor.value}`;
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity  = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    editor.value = '';
    updateCounter();
    showToast();
  }

  function showToast() {
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }

  function scheduleNextReset() {
    const now  = new Date();
    const next = new Date(now);
    next.setHours(6, 0, 0, 0);
    if (now >= next) next.setDate(next.getDate() + 1);
    setTimeout(() => { updateDateLabel(); scheduleNextReset(); }, next - now);
  }

  editor.addEventListener('input', updateCounter);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  window.addEventListener('resize', setHeaderHeight);

  setHeaderHeight();
  updateDateLabel();
  updateCounter();
  scheduleNextReset();
</script>

</body>
</html>
